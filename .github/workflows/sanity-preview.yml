name: Sanity content preview

on:
  # Sanity's authenticated webhook dispatches this workflow on codex/migration-foundation.
  # Public content remains generated at build time; no polling or public runtime CMS token.
  workflow_dispatch:
  push:
    branches: [codex/migration-foundation]

permissions:
  contents: read

concurrency:
  group: joaquimmota-migration-preview
  cancel-in-progress: false

jobs:
  refresh-preview:
    if: github.ref == 'refs/heads/codex/migration-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: e23a1ecc3719f496e47f56f20e6da716
    steps:
      - name: Check deployment credential availability
        id: credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Cloudflare deployment credential is missing. Sanity webhook builds cannot deploy yet.'
            if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then exit 1; fi
            exit 0
          fi
          echo 'configured=true' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.credential.outputs.configured == 'true'
      - uses: actions/setup-node@v4
        if: steps.credential.outputs.configured == 'true'
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        if: steps.credential.outputs.configured == 'true'
      - name: Read published Sanity content
        if: steps.credential.outputs.configured == 'true'
        run: npm run cms:fetch
      - name: Protect published URLs and compare deployed content
        id: revision
        if: steps.credential.outputs.configured == 'true'
        run: node scripts/cms/check-revision.mjs
      - name: Validate CMS integration and forms
        if: steps.credential.outputs.configured == 'true'
        run: node --test scripts/cms/*.test.mjs tests/forms/*.test.mjs
      - name: Check Astro
        if: steps.credential.outputs.configured == 'true'
        run: npm run check
      - name: Build current published content
        if: steps.credential.outputs.configured == 'true'
        run: npm run build
      - name: Recheck published URLs and write public revision metadata
        if: steps.credential.outputs.configured == 'true'
        run: node scripts/cms/check-revision.mjs --write
      - name: Deploy migration preview only
        if: steps.credential.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Cloudflare deployment credential.'; exit 1; }
          npx --yes wrangler@4.130.0 pages deploy dist --project-name joaquimmota --branch migration-preview --commit-hash "$GITHUB_SHA" --commit-dirty=true
